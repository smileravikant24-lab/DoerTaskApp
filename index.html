// One submission can list several tasks. Normalises whatever the backend sends
// into [{ index, name, status }] so each task can be approved on its own:
//   • taskList: [{ name, status }]  — preferred, carries per-task status
//   • tasks: ["a", "b"]             — plain array
//   • tasks: "a\nb"  /  "a, b"      — one cell holding several tasks
function parseTrackerTasks(item) {
  const norm = (t, i) => {
    if (t && typeof t === 'object') {
      return { index: i, name: String(t.name || t.task || '').trim(), status: String(t.status || '').trim() };
    }
    return { index: i, name: String(t || '').trim(), status: '' };
  };

  if (Array.isArray(item.taskList)) return item.taskList.map(norm).filter(t => t.name);
  if (Array.isArray(item.tasks))    return item.tasks.map(norm).filter(t => t.name);

  const raw = String(item.tasks || '').trim();
  if (!raw) return [];

  // Newlines are the reliable separator; fall back to , ; | for single-line cells
  let parts = raw.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (parts.length === 1) parts = raw.split(/\s*[,;|]\s*/).map(s => s.trim()).filter(Boolean);

  // Drop list markers the submitter may have typed ("1. ", "- ", "• ")
  return parts
    .map(s => s.replace(/^\s*(?:[-–—•*]|\d+[.)])\s+/, '').trim() || s)
    .filter(Boolean)
    .map((name, i) => ({ index: i, name: name, status: '' }));
}

function taskTrackerCard(item) {
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'tt-submission-' + item.rowNumber;

  const linksHtml = (item.links && item.links.length > 0)
    ? '<div class="meta" style="margin-top:6px;">' +
        item.links.map(l => '<a href="' + escHtml(l) + '" target="_blank" rel="noopener" style="margin-right:10px;">📎 File</a>').join('') +
      '</div>'
    : '';

  const tasks = parseTrackerTasks(item);

  card.innerHTML =
    '<div class="meta">' + escHtml(item.timestamp) + '<span class="dot">•</span>₹' + escHtml(item.amount || 0) +
      '<span class="dot">•</span>' + tasks.length + ' task' + (tasks.length === 1 ? '' : 's') + '</div>' +
    (item.description ? '<div class="meta" style="margin-top:6px;">' + escHtml(item.description) + '</div>' : '') +
    linksHtml;

  // Nothing parseable — fall back to deciding the whole submission at once
  if (tasks.length === 0) {
    card.insertAdjacentHTML('afterbegin', '<div class="task-name">' + escHtml(item.tasks || '-') + '</div>');
    card.appendChild(wholeSubmissionActions(item, card));
    return card;
  }

  // Track how many tasks still need a decision — the card clears once all are done
  card._pendingTasks = tasks.length;

  const list = document.createElement('div');
  list.style.marginTop = '10px';
  tasks.forEach(task => list.appendChild(trackerTaskRow(item, task, card)));
  card.appendChild(list);

  // Convenience: approve everything still undecided on this submission
  if (tasks.length > 1) {
    const bulk = document.createElement('div');
    bulk.className = 'actions';
    bulk.style.marginTop = '10px';
    const allBtn = document.createElement('button');
    allBtn.className = 'btn-approve';
    allBtn.textContent = '✓ Approve all ' + tasks.length;
    allBtn.onclick = () => approveAllTrackerTasks(item, card, allBtn);
    bulk.appendChild(allBtn);
    card.appendChild(bulk);
  }

  return card;
}

// One row per task, with its own Approve / Decline.
function trackerTaskRow(item, task, card) {
  const row = document.createElement('div');
  row.className = 'tt-task-row';
  row.dataset.taskIndex = String(task.index);

  const label = document.createElement('div');
  label.className = 'task-name';
  label.style.margin = '0';
  label.textContent = task.name;
  row.appendChild(label);

  const actions = document.createElement('div');
  actions.className = 'actions';

  const approveBtn = document.createElement('button');
  approveBtn.className = 'btn-approve'; approveBtn.textContent = 'Approve';
  const rejectBtn = document.createElement('button');
  rejectBtn.className = 'btn-reject'; rejectBtn.textContent = 'Decline';

  approveBtn.onclick = () => decideTrackerTask(item, task, true,  approveBtn, rejectBtn, row, card);
  rejectBtn.onclick  = () => decideTrackerTask(item, task, false, rejectBtn, approveBtn, row, card);

  actions.appendChild(approveBtn); actions.appendChild(rejectBtn);
  row.appendChild(actions);

  // A task the backend already decided shows its outcome instead of buttons
  const decided = (task.status || '').toLowerCase();
  if (decided === 'approved' || decided === 'rejected') {
    markTrackerTaskDecided(row, decided === 'approved');
    if (card._pendingTasks) card._pendingTasks--;
  }
  return row;
}

function markTrackerTaskDecided(row, approved) {
  const actions = row.querySelector('.actions');
  if (actions) actions.remove();
  row.insertAdjacentHTML('beforeend',
    '<span class="badge" style="background:' + (approved ? 'var(--green, #2e7d52)' : 'var(--amber, #b06d12)') + '">' +
      (approved ? 'Approved' : 'Declined') + '</span>');
  row.style.opacity = '.65';
}

async function decideTrackerTask(item, task, approve, btn, otherBtn, row, card) {
  let reason = '';
  if (!approve) {
    reason = (prompt('Reason for declining "' + task.name + '" (required):') || '').trim();
    if (!reason) return;
  }

  btn.disabled = true; otherBtn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = approve ? 'Approving…' : 'Declining…';

  try {
    await callTaskTrackerApi(approve ? 'approveSubmissionTask' : 'rejectSubmissionTask', {
      row: item.rowNumber,
      taskIndex: task.index,
      task: task.name,
      reason: reason
    });

    markTrackerTaskDecided(row, approve);
    toast((approve ? 'Approved: ' : 'Declined: ') + task.name, 'success');

    card._pendingTasks = Math.max(0, (card._pendingTasks || 1) - 1);
    if (card._pendingTasks === 0) removeTrackerSubmission(item.rowNumber, card);
  } catch (err) {
    toast(trackerErrorMessage(err), 'error');
    btn.disabled = false; otherBtn.disabled = false;
    btn.textContent = originalText;
  }
}

// Per-task approval needs the updated Task Tracker Code.gs. If that project
// still runs the old version it answers "Unknown action" — say so plainly
// rather than showing a bare backend string.
function trackerErrorMessage(err) {
  const msg = String((err && err.message) || err || '');
  if (/unknown action/i.test(msg)) {
    return 'Task Tracker backend purana hai — naya Code.gs deploy karke setupTaskStatusColumn() chalayein.';
  }
  return 'Task Tracker: ' + msg;
}

// Approves every task on the card that hasn't been decided yet, one call each,
// so a partial failure still leaves the rest correctly recorded.
async function approveAllTrackerTasks(item, card, allBtn) {
  const rows = [...card.querySelectorAll('.tt-task-row')]
    .filter(r => r.querySelector('.btn-approve'));
  if (rows.length === 0) return;

  allBtn.disabled = true;
  const originalText = allBtn.textContent;
  let ok = 0, failed = 0;

  for (const row of rows) {
    const idx = Number(row.dataset.taskIndex);
    const name = row.querySelector('.task-name').textContent;
    allBtn.textContent = 'Approving ' + (ok + failed + 1) + '/' + rows.length + '…';
    try {
      await callTaskTrackerApi('approveSubmissionTask', { row: item.rowNumber, taskIndex: idx, task: name, reason: '' });
      markTrackerTaskDecided(row, true);
      ok++;
    } catch (err) {
      failed++;
    }
  }

  card._pendingTasks = Math.max(0, (card._pendingTasks || 0) - ok);
  toast(failed > 0
    ? 'Approved ' + ok + ', ' + failed + ' failed — tap again to retry those'
    : 'Approved all ' + ok + ' task(s)', failed > 0 ? 'error' : 'success');

  if (card._pendingTasks === 0) removeTrackerSubmission(item.rowNumber, card);
  else { allBtn.disabled = false; allBtn.textContent = originalText; }
}

function removeTrackerSubmission(rowNumber, card) {
  card.style.transition = 'opacity .2s ease';
  card.style.opacity = '0';
  setTimeout(() => {
    Object.keys(taskTrackerCache).forEach(day => {
      taskTrackerCache[day] = taskTrackerCache[day].filter(i => i.rowNumber !== rowNumber);
      if (taskTrackerCache[day].length === 0) delete taskTrackerCache[day];
    });
    taskTrackerPendingCount = Object.values(taskTrackerCache).reduce((n, list) => n + list.length, 0);
    renderAdminView();
  }, 180);
}

// Used only when a submission has no parseable task list — decides the row as a whole.
function wholeSubmissionActions(item, card) {
  const actions = document.createElement('div');
  actions.className = 'actions';
  const approveBtn = document.createElement('button');
  approveBtn.className = 'btn-approve'; approveBtn.textContent = 'Approve';
  const rejectBtn = document.createElement('button');
  rejectBtn.className = 'btn-reject'; rejectBtn.textContent = 'Decline';
  approveBtn.onclick = () => decideTaskTrackerSubmission(item.rowNumber, true, approveBtn, rejectBtn, card);
  rejectBtn.onclick = () => decideTaskTrackerSubmission(item.rowNumber, false, rejectBtn, approveBtn, card);
  actions.appendChild(approveBtn); actions.appendChild(rejectBtn);
  return actions;
}

async function decideTaskTrackerSubmission(rowNumber, approve, btn, otherBtn, card) {
  let reason = '';
  if (!approve) {
    reason = (prompt('Reason for declining (required):') || '').trim();
    if (!reason) return;
  }

  btn.disabled = true; otherBtn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = approve ? 'Approving…' : 'Declining…';

  try {
    if (approve) await callTaskTrackerApi('approveSubmission', { row: rowNumber });
    else await callTaskTrackerApi('rejectSubmission', { row: rowNumber, reason });

    toast(approve ? 'Submission approved' : 'Submission declined', 'success');
    card.style.transition = 'opacity .2s ease';
    card.style.opacity = '0';
    setTimeout(() => {
      Object.keys(taskTrackerCache).forEach(day => {
        taskTrackerCache[day] = taskTrackerCache[day].filter(i => i.rowNumber !== rowNumber);
        if (taskTrackerCache[day].length === 0) delete taskTrackerCache[day];
      });
      taskTrackerPendingCount = Object.values(taskTrackerCache).reduce((n, list) => n + list.length, 0);
      renderAdminView();
    }, 180);
  } catch (err) {
    toast(trackerErrorMessage(err), 'error');
    btn.disabled = false; otherBtn.disabled = false;
    btn.textContent = originalText;
  }
}

function userGroupTile(group, mode) {
  const wrap = document.createElement('div');
  wrap.className = 'group collapsed'; // collapsed by default — tap to reveal tasks
  const header = document.createElement('div');
  header.className = 'group-header';
  header.innerHTML =
    '<div class="group-avatar">' + initials(group.name) + '</div>' +
    '<div class="group-info"><div class="group-name">' + group.name + '</div><div class="group-email">' + group.email + '</div></div>' +
    '<div class="group-count">' + group.tasks.length + '</div>' +
    '<div class="group-chevron">▾</div>';
  header.onclick = () => wrap.classList.toggle('collapsed');

  const body = document.createElement('div');
  body.className = 'group-body';
  if (mode === 'overdue') {
    renderGroupedByDate(body, group.tasks, (t) => overdueTaskCard(t));
  } else if (mode === 'rejected') {
    group.tasks.forEach(t => body.appendChild(rejectedTaskCard(t)));
  } else if (mode === 'done') {
    group.tasks.forEach(t => body.appendChild(doneTaskCard(t)));
  } else {
    group.tasks.forEach(t => body.appendChild(adminTaskCard(t)));
  }

  wrap.appendChild(header);
  wrap.appendChild(body);
  return wrap;
}

function overdueTaskCard(t) {
  const card = document.createElement('div');
  card.className = 'card rejected';
  const isAwaiting = t.status === 'Submitted';
  const badge = isAwaiting
    ? '<span class="badge" style="background:#7c8ba1">Awaiting Approval</span>'
    : '<span class="badge">Overdue</span>';
  card.innerHTML =
    '<div class="task-name">' + escHtml(t.task) + (t.freq ? '<span class="freq-tag">' + escHtml(FREQ_LABELS[t.freq] || t.freq) + '</span>' : '') + badge + '</div>' +
    '<div class="meta">' + escHtml(t.department) + '<span class="dot">•</span>Was planned ' + escHtml(t.planned) + '</div>';
  if (isAwaiting && isApprover) {
    const actions = document.createElement('div');
    actions.className = 'actions';
    const approveBtn = document.createElement('button');
    approveBtn.className = 'btn-approve'; approveBtn.textContent = 'Approve';
    approveBtn.onclick = () => decide(t.id, true, approveBtn);
    const rejectBtn = document.createElement('button');
    rejectBtn.className = 'btn-reject'; rejectBtn.textContent = 'Decline';
    rejectBtn.onclick = () => decide(t.id, false, rejectBtn);
    actions.appendChild(approveBtn); actions.appendChild(rejectBtn);
    card.appendChild(actions);
  } else if (isAwaiting) {
    card.insertAdjacentHTML('beforeend',
      '<div class="meta" style="margin-top:8px; color:var(--ink-light);">Waiting for pc@satijapaper.com to approve</div>');
  }
  return card;
}

// A completed task, with an Undo button. Rolling back deletes the completion
// record, so the task goes straight back to being due for the doer — use it
// when something was ticked off (and approved) by mistake.
function doneTaskCard(t) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML =
    '<div class="task-name">' + escHtml(t.task) +
      (t.freq ? '<span class="freq-tag">' + escHtml(FREQ_LABELS[t.freq] || t.freq) + '</span>' : '') +
      '<span class="badge" style="background:var(--green, #2e7d52)">' + escHtml(t.status || 'Done') + '</span></div>' +
    '<div class="meta">' + escHtml(t.department) + '<span class="dot">•</span>Planned ' + escHtml(t.planned) +
      (t.actual ? '<span class="dot">•</span>Done ' + escHtml(t.actual) : '') + '</div>';

  const actions = document.createElement('div');
  actions.className = 'actions';
  const undoBtn = document.createElement('button');
  undoBtn.className = 'btn-reject';
  undoBtn.textContent = '↺ Undo (mark as not done)';
  undoBtn.onclick = () => rollbackTask(t, undoBtn, card);
  actions.appendChild(undoBtn);
  card.appendChild(actions);
  return card;
}

async function rollbackTask(t, btn, card) {
  const ok = confirm(
    'Undo this completion?\n\n' +
    t.task + '\n' + (t.name || t.email) + '\nPlanned: ' + t.planned + '\n\n' +
    'The task goes back to pending and the doer will have to do it again.'
  );
  if (!ok) return;

  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = 'Undoing…';

  try {
    await callApi('rollback', { id: t.id });
    toast('Rolled back — task is pending again', 'success');
    adminDoneCache = adminDoneCache.filter(x => String(x.id) !== String(t.id));
    localCacheSet('admin_v2_' + userEmail, {
      pending: adminPendingCache, overdue: adminOverdueCache,
      performance: adminPerformanceCache, rejected: adminRejectedCache,
      done: adminDoneCache
    });
    card.style.transition = 'opacity .2s ease';
    card.style.opacity = '0';
    setTimeout(() => renderAdminView(), 180);
  } catch (err) {
    toast(err.message, 'error');
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

function rejectedTaskCard(t) {
  const card = document.createElement('div');
  card.className = 'card rejected';
  card.innerHTML =
    '<div class="task-name">' + escHtml(t.task) + (t.freq ? '<span class="freq-tag">' + escHtml(FREQ_LABELS[t.freq] || t.freq) + '</span>' : '') + '<span class="badge">Rejected</span></div>' +
    '<div class="meta">' + escHtml(t.department) + '<span class="dot">•</span>Planned ' + escHtml(t.planned) + '</div>' +
    (t.remark ? '<div class="meta" style="margin-top:6px; color:var(--amber);">Reason: ' + escHtml(t.remark) + '</div>' : '');
  return card;
}

function adminTaskCard(t) {
  const card = document.createElement('div');
  card.className = 'card';
  // No "Actual" here on purpose: a task waiting for review always has a
  // blank column H (approval is what fills it), so showing "Actual —" on
  // every card was noise. Approving is what stamps the date.
  card.innerHTML =
    '<div class="task-name">' + escHtml(t.task) + (t.freq ? '<span class="freq-tag">' + escHtml(FREQ_LABELS[t.freq] || t.freq) + '</span>' : '') + '</div>' +
    '<div class="meta">' + escHtml(t.department) + '<span class="dot">•</span>Planned ' + escHtml(t.planned) +
    '<span class="dot">•</span><span style="opacity:.5">ID ' + escHtml(String(t.id)) + '</span></div>';
  if (isApprover) {
    const actions = document.createElement('div');
    actions.className = 'actions';
    const approveBtn = document.createElement('button');
    approveBtn.className = 'btn-approve'; approveBtn.textContent = 'Approve';
    approveBtn.onclick = () => decide(t.id, true, approveBtn);
    const rejectBtn = document.createElement('button');
    rejectBtn.className = 'btn-reject'; rejectBtn.textContent = 'Decline';
    rejectBtn.onclick = () => decide(t.id, false, rejectBtn);
    actions.appendChild(approveBtn); actions.appendChild(rejectBtn);
    card.appendChild(actions);
  } else {
    card.insertAdjacentHTML('beforeend',
      '<div class="meta" style="margin-top:8px; color:var(--ink-light);">Waiting for pc@satijapaper.com to approve</div>');
  }
  return card;
}

async function decide(id, approve, btn) {
  if (!isApprover) {
    toast('Only pc@satijapaper.com can approve or reject tasks.', 'error');
    return;
  }
  if (!id) {
    toast('This task list is out of date — refreshing…', 'error');
    loadAdminView(true);
    return;
  }
  const card = btn.closest('.card');
  const originalText = btn.textContent;
  btn.disabled = true;

  let remark = '';
  if (!approve) {
    remark = (prompt('Reason for declining (required):') || '').trim();
    if (!remark) { toast('Please enter a reason for declining', 'error'); btn.disabled = false; return; }
  }

  // Capture the task's details before it's filtered out of the pending/overdue
  // caches, so a successful reject can add it straight into the Rejected tab
  // instead of that tab staying stale until the next full refresh.
  const sourceEntry = adminPendingCache.find(t => String(t.id) === String(id)) ||
                       adminOverdueCache.find(t => String(t.id) === String(id));

  let result = null, lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    if (attempt > 0) {
      btn.textContent = 'Retrying…';
      await new Promise(r => setTimeout(r, attempt * 1500));
    }
    try {
      result = approve ? await callApi('approve', { id }) : await callApi('reject', { id, remark });
      lastErr = null;
      break;
    } catch (e) {
      lastErr = e;
    }
  }

  if (result) {
    toast(approve ? 'Task approved' : 'Task declined — sent back to doer', 'success');
    card.style.transition = 'opacity .2s ease';
    card.style.opacity = '0';
    setTimeout(() => {
      adminPendingCache = adminPendingCache.filter(t => String(t.id) !== String(id));
      adminOverdueCache = adminOverdueCache.filter(t => String(t.id) !== String(id));
      if (!approve && sourceEntry) {
        adminRejectedCache = adminRejectedCache.concat([{
          id: sourceEntry.id, name: sourceEntry.name, email: sourceEntry.email,
          department: sourceEntry.department, freq: sourceEntry.freq,
          task: sourceEntry.task, planned: sourceEntry.planned, remark: remark
        }]);
      }
      localCacheSet('admin_v2_' + userEmail, { pending: adminPendingCache, overdue: adminOverdueCache, performance: adminPerformanceCache, rejected: adminRejectedCache });
      renderAdminView();
    }, 180);
  } else {
    btn.textContent = 'Checking…';
    try {
      const freshData = await callApi('adminSummary', { force: 1 });
      if (freshData.pending) adminPendingCache = freshData.pending;
      if (freshData.overdue) adminOverdueCache = freshData.overdue;
      if (freshData.performance) adminPerformanceCache = freshData.performance;
      if (freshData.rejected) adminRejectedCache = freshData.rejected;
      if (freshData.doers) doersList = freshData.doers;
      localCacheSet('admin_v2_' + userEmail, { pending: adminPendingCache, overdue: adminOverdueCache, performance: adminPerformanceCache, rejected: adminRejectedCache });
      const taskGone = !adminPendingCache.some(t => String(t.id) === String(id)) &&
                       !adminOverdueCache.some(t => String(t.id) === String(id));
      if (taskGone) {
        toast(approve ? 'Task approved' : 'Task declined — sent back to doer', 'success');
        card.style.transition = 'opacity .2s ease';
        card.style.opacity = '0';
        setTimeout(() => renderAdminView(), 180);
      } else {
        toast(lastErr ? lastErr.message : 'Action failed — please try again', 'error');
        btn.disabled = false;
        btn.textContent = originalText;
      }
    } catch (_) {
      toast(lastErr ? lastErr.message : 'Action failed — please try again', 'error');
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }
}
</script>
