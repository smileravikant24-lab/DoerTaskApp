<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Task App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --ink: #1E2A44;
    --ink-light: #2E3D5F;
    --paper: #FAF7F1;
    --card: #FFFFFF;
    --amber: #B4682E;
    --amber-bg: #FBEEE3;
    --green: #2F6F4E;
    --green-dark: #245A3E;
    --red: #B4432E;
    --text: #22262E;
    --muted: #767E8C;
    --line: #ECE6DC;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--paper);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, .brand, .task-name, .stat-num, .group-name { font-family: "Manrope", -apple-system, sans-serif; }

  header {
    background: linear-gradient(135deg, var(--ink) 0%, var(--ink-light) 100%);
    color: #fff;
    padding: 20px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 5;
    box-shadow: 0 2px 12px rgba(30,42,68,0.18);
    gap: 10px;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-icon {
    width: 34px; height: 34px; border-radius: 9px;
    background: rgba(255,255,255,0.14);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  header h1 { font-size: 17px; font-weight: 800; margin: 0; letter-spacing: -0.01em; white-space: nowrap; }
  .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  header .email {
    font-size: 11.5px; opacity: .85; background: rgba(255,255,255,0.1);
    padding: 5px 10px; border-radius: 999px; white-space: nowrap;
  }
  .logout-btn {
    background: rgba(255,255,255,0.14); color: #fff; border: none; border-radius: 999px;
    padding: 6px 13px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .logout-btn:hover { background: rgba(255,255,255,0.24); }

  .container { max-width: 680px; margin: 0 auto; padding: 18px 16px 40px; }

  .install-tip {
    font-size: 12.5px; color: var(--ink-light);
    background: #EEF1F7; border: 1px solid #E1E6F0;
    border-radius: 10px; padding: 11px 14px; margin-bottom: 18px;
    display: flex; align-items: center; gap: 8px;
  }

  .stat-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .stat-box { flex: 1 1 100px; }
  .stat-box {
    flex: 1; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px;
  }
  .stat-num { font-size: 22px; font-weight: 800; line-height: 1; }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .04em; }
  .stat-box.warn .stat-num { color: var(--amber); }
  .stat-box.ok .stat-num { color: var(--ink); }

  .section-title {
    font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 26px 0 10px; display: flex; align-items: center; gap: 6px;
  }
  .section-title:first-of-type { margin-top: 0; }
  .section-title.warn { color: var(--amber); }
  .date-subhead {
    font-size: 11px; font-weight: 800; color: var(--muted); margin: 12px 2px 5px;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .date-subhead .date-count { color: var(--amber); font-weight: 700; }

  /* --- Filter chips + legend --- */
  .filter-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-bottom: 16px; }
  .chip {
    font-size: 12px; font-weight: 700; padding: 6px 13px; border-radius: 999px;
    background: var(--card); border: 1.5px solid var(--line); color: var(--muted);
    cursor: pointer; transition: all .12s ease; white-space: nowrap;
  }
  .chip:hover { border-color: var(--ink-light); color: var(--ink); }
  .chip.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .legend-btn {
    margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ink-light);
    background: none; border: none; cursor: pointer; padding: 6px 4px; text-decoration: underline;
    text-underline-offset: 2px;
  }
  .legend-panel {
    background: #F1F4F9; border: 1px solid #DEE4EE; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 16px; font-size: 12px; color: var(--ink-light);
    display: none;
  }
  .legend-panel.open { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 6px 14px; }
  .legend-panel b { color: var(--ink); }

  /* --- Department / user filter bar --- */
  .filter-bar {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 12px;
  }
  .filter-group { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .filter-label {
    font-size: 10.5px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); white-space: nowrap;
  }
  .filter-select {
    font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--ink);
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 8px;
    padding: 6px 9px; cursor: pointer; max-width: 190px;
  }
  .filter-select:hover { border-color: var(--ink-light); }
  .filter-select.on { border-color: var(--ink); background: #fff; }
  .clear-filters {
    margin-left: auto; font-size: 12px; font-weight: 700; color: var(--red);
    background: none; border: none; cursor: pointer; padding: 4px;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .summary-line { font-size: 12.5px; color: var(--muted); margin: 0 2px 12px; }
  .summary-line b { color: var(--ink); font-weight: 800; }

  /* --- User group tiles (admin) --- */
  .group {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    margin-bottom: 14px; overflow: hidden; animation: rise .25s ease both;
  }
  .group-header {
    padding: 13px 16px; display: flex; align-items: center; gap: 10px;
    cursor: pointer; user-select: none;
  }
  .group-avatar {
    width: 34px; height: 34px; border-radius: 50%; background: var(--ink);
    color: #fff; font-size: 13px; font-weight: 800; display: flex;
    align-items: center; justify-content: center; flex-shrink: 0;
  }
  .group-info { flex: 1; min-width: 0; }
  .group-name { font-size: 14.5px; font-weight: 700; }
  .group-email { font-size: 11.5px; color: var(--muted); }
  .group-count {
    font-size: 11.5px; font-weight: 700; background: var(--amber-bg); color: var(--amber);
    padding: 3px 10px; border-radius: 999px; flex-shrink: 0;
  }
  .group-chevron { color: var(--muted); transition: transform .2s ease; flex-shrink: 0; }
  .group.collapsed .group-chevron { transform: rotate(-90deg); }
  .group-body { border-top: 1px solid var(--line); padding: 4px 12px 10px; }
  .group.collapsed .group-body { display: none; }

  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 15px 16px;
    margin: 10px 0;
    border-left: 4px solid var(--ink);
    box-shadow: 0 1px 2px rgba(30,20,10,0.05);
    animation: rise .2s ease both;
  }
  .group .card { box-shadow: none; border: 1px solid var(--line); border-left: 4px solid var(--ink); }
  .card.rejected { border-left-color: var(--amber); background: linear-gradient(0deg, var(--amber-bg) 0%, var(--card) 55%); }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .card .task-name { font-weight: 700; font-size: 15.5px; letter-spacing: -0.005em; }
  .card .meta { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .card .meta .dot { margin: 0 5px; opacity: .6; }
  .card .actions { margin-top: 12px; display: flex; gap: 8px; }
  /* One task inside a Task Tracker submission — each approved on its own */
  .tt-task-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 9px 0; border-top: 1px solid var(--line, #E7ECF4);
  }
  .tt-task-row:first-child { border-top: none; }
  .tt-task-row .task-name { flex: 1 1 180px; min-width: 0; overflow-wrap: anywhere; }
  .tt-task-row .actions { margin-top: 0; flex: 0 0 auto; }
  .tt-task-row .actions button { padding: 5px 12px; font-size: 12px; }
  .freq-tag {
    display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 7px;
    border-radius: 5px; background: #E7ECF4; color: var(--ink-light); margin-left: 7px;
    text-transform: uppercase; letter-spacing: .02em; vertical-align: middle;
  }

  button {
    border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px;
    font-weight: 700; cursor: pointer; transition: transform .1s ease, opacity .15s ease;
    font-family: inherit;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: .55; cursor: default; transform: none; }

  .btn-done, .btn-approve { background: var(--green); color: #fff; }
  .btn-done:hover, .btn-approve:hover { background: var(--green-dark); }
  .btn-reject { background: #fff; color: var(--red); border: 1.5px solid #E8CFC7; }
  .btn-reject:hover { background: #FBEFEC; }

  .empty {
    color: var(--muted); font-size: 13.5px; padding: 16px 4px;
    display: flex; align-items: center; gap: 8px;
  }

  .badge {
    display: inline-block; font-size: 10.5px; font-weight: 700; padding: 3px 9px;
    border-radius: 999px; background: var(--amber); color: #fff; margin-left: 8px;
    text-transform: uppercase; letter-spacing: .03em; vertical-align: middle;
  }

  .center {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 20px;
    background: radial-gradient(circle at 50% 0%, #EEF1F7 0%, var(--paper) 55%);
  }
  .center .brand-icon-lg {
    width: 56px; height: 56px; border-radius: 16px; background: var(--ink);
    display: flex; align-items: center; justify-content: center; margin-bottom: 18px;
  }
  .center h2 { font-size: 22px; font-weight: 800; margin: 0 0 6px; color: var(--ink); }
  .center p { color: var(--muted); font-size: 14px; margin: 0 0 22px; }

  .error-box {
    background: #FBECE8; color: var(--red); padding: 13px 16px; border-radius: 10px;
    margin-top: 16px; max-width: 380px; font-size: 13.5px; border: 1px solid #F1D4CC;
  }
  #g_id_signin_container { display: flex; justify-content: center; }

  /* --- Toasts --- */
  #toastHost {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; z-index: 999;
    width: 100%; max-width: 380px; padding: 0 16px; align-items: center;
  }
  .toast {
    width: 100%; background: var(--ink); color: #fff; border-radius: 10px;
    padding: 12px 14px; font-size: 13.5px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(20,25,40,0.25);
    display: flex; align-items: center; gap: 9px;
    animation: toastIn .25s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .toast.leaving { animation: toastOut .2s ease both; }
  .toast .t-icon { flex-shrink: 0; }
  .toast.success { background: var(--green-dark); }
  .toast.error { background: var(--red); }
  .toast.info { background: var(--ink); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(8px); } }
</style>
</head>
<body>

<div id="signedOut" class="center">
  <div class="brand-icon-lg">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M9 12.5l2 2 4-4.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3.5" y="3.5" width="17" height="17" rx="4" stroke="#fff" stroke-width="1.6"/></svg>
  </div>
  <h2>Daily Task App</h2>
  <p>Sign in with Google to continue.</p>
  <div id="g_id_signin_container"></div>
  <div id="errorBox"></div>
</div>

<div id="signedIn" style="display:none">
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 12.5l2 2 4-4.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3.5" y="3.5" width="17" height="17" rx="4" stroke="#fff" stroke-width="1.6"/></svg>
      </div>
      <h1 id="pageTitle">My Tasks Today</h1>
    </div>
    <div class="header-right">
      <span class="email" id="userEmailLabel"></span>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>
  <div class="container">
    <div id="app"><div class="empty">Loading…</div></div>
  </div>
</div>

<div id="toastHost"></div>

<script>
// ============================================================
// CONFIG
// ============================================================
const CLIENT_ID = "609136108830-jf0fovqkjd3l5bv4kal7kg7su2emkfi0.apps.googleusercontent.com";
const API_URL = "https://script.google.com/macros/s/AKfycbwmL_WFZqZMNFl2-lOe0vWLWQHq50srOinFk3ZnO7eZ-Xti2gXfo8a4BhIMsbzeH0XdTA/exec";
// A separate Apps Script project (the Hindi "दैनिक कार्य ट्रैकर" — day
// checklist + expense tracker with file uploads). Its own deployment
// identifies the caller via Session.getActiveUser() (the browser's Google
// session), not this app's idToken — so calls to it never send idToken.
const TASK_TRACKER_API_URL = "https://script.google.com/macros/s/AKfycbwN-zMYqEPGy4IdgXHMxcsIwndpKLzib7hGqRxIx_j4pdy-V7xAHn10RYq2aM2HOzZ3/exec";

// Full view access to the Review Panel (To Review, Overdue, Rejected, View As).
const ADMIN_EMAILS = ["pc@satijapaper.com", "mis@satijapaper.com"];
// Only these can actually approve/reject/bulk-approve — mis@ deliberately
// excluded: she can see everything but pc@ is the only one who approves.
const APPROVER_EMAILS = ["pc@satijapaper.com"];
// Performance tracking is MIS's job, not pc@'s — separate from approval
// rights on purpose, so this list can diverge from APPROVER_EMAILS.
const PERFORMANCE_VIEWER_EMAILS = ["mis@satijapaper.com"];
const TOKEN_STORAGE_KEY = "doerAppIdToken";

const FREQ_LABELS = {
  D: "Daily", W: "Weekly", F: "Fortnightly", M: "Monthly", Q: "Quarterly", Y: "Yearly",
  E1: "1st weekday/mo", E2: "2nd weekday/mo",
  E1ST: "1st weekday/mo", E2ND: "2nd weekday/mo", E3RD: "3rd weekday/mo",
  E4TH: "4th weekday/mo", ELAST: "Last weekday/mo"
};

let idToken = null;
let userEmail = null;
let isAdmin = false;
let isApprover = false;
let canSeePerformance = false;
let viewAsEmail = null;  // when admin views another user's tasks; null = own tasks
let doersList = [];      // [{email, name}] — populated from adminSummary response

let adminFilter = "All";       // frequency
let adminDeptFilter = "All";   // department
let adminUserFilter = "All";   // doer (by email)
let adminPendingCache = [];

let doerFilter = "All";
let doerDeptFilter = "All";
let doerStatusFilter = "all"; // 'all' | 'overdue' | 'rejected' | 'today'
let doerTodayCache = [];
let doerRejectedCache = [];
let doerOverdueCache = [];
// Non-Daily tasks the doer has marked done that are waiting on the admin.
// Column H stays blank until approval, so without this the task would just
// disappear from their screen with no sign it went anywhere.
let doerAwaitingCache = [];

// ------------------------------------------------------------
// TOASTS
// ------------------------------------------------------------
function toast(message, type = "info") {
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icon = type === 'success' ? '✓' : (type === 'error' ? '✕' : 'ℹ');
  el.innerHTML = '<span class="t-icon">' + icon + '</span><span>' + message + '</span>';
  host.appendChild(el);
  setTimeout(() => {
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 220);
  }, 3200);
}

// ------------------------------------------------------------
// GOOGLE SIGN-IN + PERSISTED SESSION
// ------------------------------------------------------------
function decodeJwt(token) {
  return JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
}

window.addEventListener('load', () => {
  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: handleCredentialResponse
  });
  google.accounts.id.renderButton(
    document.getElementById('g_id_signin_container'),
    { theme: "filled_black", size: "large", text: "signin_with", shape: "pill" }
  );

  document.getElementById('logoutBtn').onclick = logout;

  // Try to resume a previous session so a page refresh doesn't sign the user out
  const saved = localStorage.getItem(TOKEN_STORAGE_KEY);
  if (saved) {
    try {
      const payload = decodeJwt(saved);
      if (payload.exp && payload.exp * 1000 > Date.now()) {
        signInWithToken(saved);
        return;
      }
    } catch (e) { /* fall through to normal sign-in screen */ }
    localStorage.removeItem(TOKEN_STORAGE_KEY);
  }
});

function handleCredentialResponse(response) {
  localStorage.setItem(TOKEN_STORAGE_KEY, response.credential);
  signInWithToken(response.credential);
}

let adminShowMyTasks = false; // admin (pc@satijapaper.com) also has her own tasks in Master — this toggles her personal task list on top of the review panel

function signInWithToken(token) {
  idToken = token;
  const payload = decodeJwt(idToken);
  userEmail = payload.email;
  isAdmin = ADMIN_EMAILS.some(a => a.toLowerCase() === userEmail.toLowerCase());
  isApprover = APPROVER_EMAILS.some(a => a.toLowerCase() === userEmail.toLowerCase());
  canSeePerformance = PERFORMANCE_VIEWER_EMAILS.some(a => a.toLowerCase() === userEmail.toLowerCase());

  document.getElementById('signedOut').style.display = 'none';
  document.getElementById('signedIn').style.display = 'block';
  document.getElementById('userEmailLabel').textContent = userEmail;

  adminShowMyTasks = false;
  doerViewHasData = false;
  adminViewHasData = false;
  document.getElementById('pageTitle').textContent = isAdmin ? "Review Panel" : "My Tasks Today";
  if (isAdmin) loadAdminView(); else loadDoerView();
}

function logout() {
  localStorage.removeItem(TOKEN_STORAGE_KEY);
  idToken = null; userEmail = null; isAdmin = false; viewAsEmail = null; doersList = [];
  if (window.google && google.accounts && google.accounts.id) {
    google.accounts.id.disableAutoSelect();
  }
  document.getElementById('signedIn').style.display = 'none';
  document.getElementById('signedOut').style.display = 'flex';
  document.getElementById('errorBox').innerHTML = '';
}

function showError(msg) {
  document.getElementById('errorBox').innerHTML = '<div class="error-box">' + msg + '</div>';
}

// ------------------------------------------------------------
// API CALLS
// ------------------------------------------------------------
async function callApi(action, params = {}) {
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  url.searchParams.set('idToken', idToken);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));

  // Without a timeout, a hung request blocks forever with no error. Normal
  // reads now come from the backend's snapshot and return in well under a
  // second, but the very first request after a cache expiry has to build
  // that snapshot from the (slow, formula-heavy) sheet — which can take a
  // couple of minutes. So the ceiling is generous; it's a backstop for a
  // genuinely dead request, not the expected path.
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 150000);
  let res;
  try {
    res = await fetch(url.toString(), { signal: controller.signal });
  } catch (err) {
    if (err.name === 'AbortError') throw new Error('Request timed out — please try again');
    throw err;
  } finally {
    clearTimeout(timeoutId);
  }
  const json = await res.json();
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

// Same shape as callApi, but for the separate Task Tracker deployment. Its
// form is public (submitters use personal Gmail accounts), so it can't
// identify pc@ via its own session — it verifies THIS app's idToken
// instead, so it's sent here just like callApi does for our own backend.
async function callTaskTrackerApi(action, params = {}) {
  const url = new URL(TASK_TRACKER_API_URL);
  url.searchParams.set('action', action);
  url.searchParams.set('idToken', idToken);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 60000);
  let res;
  try {
    res = await fetch(url.toString(), { signal: controller.signal });
  } catch (err) {
    if (err.name === 'AbortError') throw new Error('Request timed out — please try again');
    throw err;
  } finally {
    clearTimeout(timeoutId);
  }
  const json = await res.json();
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

// ------------------------------------------------------------
// SHARED: escaping. Task names, departments and people's names come from
// the sheet, so they can contain quotes or angle brackets — those must not
// be able to break the markup they're inserted into.
// ------------------------------------------------------------
function escHtml(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ------------------------------------------------------------
// ADMIN FILTERS — frequency + department + user, applied together
// ------------------------------------------------------------

// Applies the active admin filters. Pass skipFreq/skipDept/skipUser to
// leave one out — used to count each filter's options against the set the
// OTHER filters already narrowed to, so every number shown is what you'd
// actually get by picking it.
function applyAdminFilters(list, skip) {
  skip = skip || {};
  return list.filter(t =>
    (skip.freq || adminFilter === 'All' || t.freq === adminFilter) &&
    (skip.dept || adminDeptFilter === 'All' || String(t.department || '').trim() === adminDeptFilter) &&
    (skip.user || adminUserFilter === 'All' || t.email === adminUserFilter)
  );
}

function renderAdminFilters(container, source) {
  const freqBase = applyAdminFilters(source, { freq: true });
  const deptBase = applyAdminFilters(source, { dept: true });
  const userBase = applyAdminFilters(source, { user: true });

  // --- frequency chips ---
  const freqs = [...new Set(source.map(t => t.freq).filter(Boolean))];
  let html = '<div class="filter-row">' +
    '<div class="chip freq-chip ' + (adminFilter === 'All' ? 'active' : '') + '" data-freq="All">All (' + freqBase.length + ')</div>';
  freqs.forEach(f => {
    const n = freqBase.filter(t => t.freq === f).length;
    html += '<div class="chip freq-chip ' + (adminFilter === f ? 'active' : '') + '" data-freq="' + escHtml(f) + '">' +
            escHtml(FREQ_LABELS[f] || f) + ' (' + n + ')</div>';
  });
  html += '<button class="legend-btn" id="legendToggle">Legend</button></div>';
  html += '<div class="legend-panel" id="legendPanel">' +
    Object.entries(FREQ_LABELS).map(([code, label]) => '<div><b>' + code + '</b> — ' + label + '</div>').join('') +
    '</div>';

  // --- department + user dropdowns ---
  const depts = [...new Set(source.map(t => String(t.department || '').trim()).filter(Boolean))].sort();
  const nameByEmail = {};
  source.forEach(t => { if (t.email && !nameByEmail[t.email]) nameByEmail[t.email] = t.name || t.email; });
  const users = Object.keys(nameByEmail).sort((a, b) =>
    String(nameByEmail[a]).localeCompare(String(nameByEmail[b])));

  html += '<div class="filter-bar">';

  html += '<div class="filter-group"><span class="filter-label">Department</span>' +
          '<select class="filter-select' + (adminDeptFilter !== 'All' ? ' on' : '') + '" id="deptSelect">' +
          '<option value="All">All (' + deptBase.length + ')</option>';
  depts.forEach(dp => {
    const n = deptBase.filter(t => String(t.department || '').trim() === dp).length;
    html += '<option value="' + escHtml(dp) + '"' + (adminDeptFilter === dp ? ' selected' : '') + '>' +
            escHtml(dp) + ' (' + n + ')</option>';
  });
  html += '</select></div>';

  html += '<div class="filter-group"><span class="filter-label">User</span>' +
          '<select class="filter-select' + (adminUserFilter !== 'All' ? ' on' : '') + '" id="userSelect">' +
          '<option value="All">All (' + userBase.length + ')</option>';
  users.forEach(u => {
    const n = userBase.filter(t => t.email === u).length;
    html += '<option value="' + escHtml(u) + '"' + (adminUserFilter === u ? ' selected' : '') + '>' +
            escHtml(nameByEmail[u]) + ' (' + n + ')</option>';
  });
  html += '</select></div>';

  const anyActive = adminFilter !== 'All' || adminDeptFilter !== 'All' || adminUserFilter !== 'All';
  if (anyActive) html += '<button class="clear-filters" id="clearFilters">Clear filters</button>';
  html += '</div>';

  container.insertAdjacentHTML('beforeend', html);

  container.querySelectorAll('.freq-chip').forEach(chip => {
    chip.onclick = () => { adminFilter = chip.dataset.freq; renderAdminView(); };
  });
  document.getElementById('legendToggle').onclick = () =>
    document.getElementById('legendPanel').classList.toggle('open');
  document.getElementById('deptSelect').onchange = (e) => { adminDeptFilter = e.target.value; renderAdminView(); };
  document.getElementById('userSelect').onchange = (e) => { adminUserFilter = e.target.value; renderAdminView(); };
  const clearBtn = document.getElementById('clearFilters');
  if (clearBtn) clearBtn.onclick = () => {
    adminFilter = 'All'; adminDeptFilter = 'All'; adminUserFilter = 'All'; renderAdminView();
  };
}

// ------------------------------------------------------------
// SHARED: filter chips + legend
// ------------------------------------------------------------
function renderFilterRow(container, itemsForCounts, currentFilter, onSelect) {
  const freqsPresent = [...new Set(itemsForCounts.map(t => t.freq).filter(Boolean))];
  let html = '<div class="filter-row"><div class="chip freq-chip ' + (currentFilter === "All" ? "active" : "") + '" data-freq="All">All (' + itemsForCounts.length + ')</div>';
  freqsPresent.forEach(f => {
    const count = itemsForCounts.filter(t => t.freq === f).length;
    html += '<div class="chip freq-chip ' + (currentFilter === f ? "active" : "") + '" data-freq="' + f + '">' + (FREQ_LABELS[f] || f) + ' (' + count + ')</div>';
  });
  html += '<button class="legend-btn" id="legendToggle">Legend</button></div>';
  html += '<div class="legend-panel" id="legendPanel">' +
    Object.entries(FREQ_LABELS).map(([code, label]) => '<div><b>' + code + '</b> — ' + label + '</div>').join('') +
    '</div>';
  container.insertAdjacentHTML('beforeend', html);

  // Scoped to .freq-chip only — the doer view also has .status-chip elements
  // sharing the base .chip class; a plain '.chip' query here used to also
  // grab those and overwrite their click handlers with this one (whose
  // dataset.freq is undefined on a status chip), breaking the status filter.
  container.querySelectorAll('.freq-chip').forEach(chip => {
    chip.onclick = () => onSelect(chip.dataset.freq);
  });
  document.getElementById('legendToggle').onclick = () => document.getElementById('legendPanel').classList.toggle('open');
}

// ------------------------------------------------------------
// SHARED: group a list of tasks into day-wise sub-sections
// (assumes items already arrive in chronological order)
// ------------------------------------------------------------
function renderGroupedByDate(container, items, cardFn) {
  const groups = new Map();
  items.forEach(t => {
    if (!groups.has(t.planned)) groups.set(t.planned, []);
    groups.get(t.planned).push(t);
  });
  [...groups.entries()].forEach(([date, list]) => {
    container.insertAdjacentHTML('beforeend',
      '<div class="date-subhead">' + date + ' <span class="date-count">(' + list.length + ')</span></div>');
    list.forEach(t => container.appendChild(cardFn(t)));
  });
}

// ------------------------------------------------------------
// LOCAL CACHE — show last-known data instantly on open, then
// silently refresh from the server in the background.
// ------------------------------------------------------------
function localCacheGet(key) {
  try {
    const raw = localStorage.getItem('doerapp_' + key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function localCacheSet(key, value) {
  try { localStorage.setItem('doerapp_' + key, JSON.stringify(value)); } catch (e) { /* ignore quota errors */ }
}

// ------------------------------------------------------------
// DOER VIEW
// ------------------------------------------------------------
let doerViewHasData = false; // true once the view has shown real (cached or live) data — guards against a failed refresh wiping a working screen

// The backend serves reads from a snapshot it rebuilds in the background,
// so responses carry when that snapshot was built and whether a rebuild is
// currently queued. Kept here so the Refresh buttons can say something
// accurate instead of implying the data is live to the second.
let lastBuiltAt = null;
let lastRefreshQueued = false;

function freshnessLabel() {
  if (!lastBuiltAt) return '';
  const secs = Math.max(0, Math.round((Date.now() - lastBuiltAt) / 1000));
  if (secs < 60) return 'just now';
  const mins = Math.round(secs / 60);
  return mins === 1 ? '1 min ago' : mins + ' min ago';
}

// A manual Refresh can't rebuild the snapshot inline — on a sheet this size
// that takes longer than the browser will wait — so the backend queues a
// background rebuild and serves what it has. Say that plainly rather than
// claiming the data is live.
function refreshToastMessage() {
  if (lastRefreshQueued) return 'Updating from the sheet — tap Refresh again in a minute for the newest data';
  const age = freshnessLabel();
  return age ? 'Showing data from ' + age : 'Refreshed';
}

async function loadDoerView(force) {
  const effectiveEmail = (isAdmin && viewAsEmail) ? viewAsEmail : userEmail;
  const cacheKey = 'dashboard_v2_' + effectiveEmail;
  const cached = force ? null : localCacheGet(cacheKey);
  if (cached) {
    doerTodayCache = cached.today;
    doerRejectedCache = cached.rejected;
    doerOverdueCache = cached.overdue || [];
    doerAwaitingCache = cached.awaiting || [];
    doerFilter = "All";
    renderDoerView(); // instant paint from last-known data
    updateRejectedBadge();
    doerViewHasData = true;
  }
  try {
    const apiParams = force ? { force: 1 } : {};
    if (isAdmin && viewAsEmail) apiParams.viewAs = viewAsEmail;
    const data = await callApi('dashboard', apiParams);
    doerTodayCache = data.today;
    doerRejectedCache = data.rejected;
    doerOverdueCache = data.overdue || [];
    doerAwaitingCache = data.awaiting || [];
    lastBuiltAt = data.builtAt || null;
    lastRefreshQueued = !!data.refreshing;
    localCacheSet(cacheKey, data);
    doerFilter = "All";
    renderDoerView(); // refresh with live data
    notifyNewRejections(doerRejectedCache);
    updateRejectedBadge();
    doerViewHasData = true;
    return true;
  } catch (err) {
    // Only replace the screen with an error box if there's nothing already
    // showing — otherwise a failed Refresh would wipe out a perfectly good
    // view that was already on screen, instead of just reporting the error.
    if (!doerViewHasData) {
      document.getElementById('app').innerHTML = '<div class="error-box">' + err.message + '</div>';
    }
    toast(err.message, 'error');
    return false;
  }
}

// ------------------------------------------------------------
// REJECTED-TASK NOTIFICATIONS
// (1) OS/browser push notification when a task is newly rejected
// (2) In-app badge: tab title count + a notification bar in the app
// ------------------------------------------------------------
function updateRejectedBadge() {
  const n = doerRejectedCache.length;
  document.title = n > 0 ? '(' + n + ') Daily Task App' : 'Daily Task App';
}

function notifyNewRejections(rejectedList) {
  if (!('Notification' in window) || !userEmail) return;
  const seenKey = 'doerapp_seenRejected_v2_' + userEmail;
  const seenIds = new Set(localCacheGet(seenKey) || []);
  const currentIds = rejectedList.map(t => t.id);
  const newlyRejected = rejectedList.filter(t => !seenIds.has(t.id));

  if (newlyRejected.length > 0) {
    const body = newlyRejected.length === 1
      ? newlyRejected[0].task + ' was rejected — redo required.'
      : newlyRejected.length + ' of your tasks were rejected — redo required.';

    const fire = () => {
      try {
        new Notification('Task Rejected', { body, tag: 'doerapp-rejected' });
      } catch (e) { /* ignore — e.g. unsupported in this context */ }
    };

    if (Notification.permission === 'granted') {
      fire();
    } else if (Notification.permission !== 'denied') {
      Notification.requestPermission().then(perm => { if (perm === 'granted') fire(); });
    }
  }

  localCacheSet(seenKey, currentIds);
}

function renderDoerView() {
  const app = document.getElementById('app');
  app.innerHTML = "";
  const allItems = doerTodayCache.concat(doerRejectedCache, doerOverdueCache);

  app.insertAdjacentHTML('beforeend',
    '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">' +
      (isAdmin && adminShowMyTasks ? '<button class="legend-btn" id="backToReviewBtn">← Back to Review Panel</button>' : '<span></span>') +
      '<button class="legend-btn" id="doerRefreshBtn">⟳ Refresh</button>' +
    '</div>'
  );
  if (isAdmin && adminShowMyTasks) {
    document.getElementById('backToReviewBtn').onclick = () => {
      adminShowMyTasks = false;
      viewAsEmail = null;
      document.getElementById('pageTitle').textContent = 'Review Panel';
      loadAdminView();
    };
  }

  // Admin "View As" dropdown — lets admin see any user's task list
  if (isAdmin) {
    let dropHtml =
      '<div style="margin-bottom:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;">' +
        '<span style="font-size:13px; color:var(--ink-light); white-space:nowrap;">View as:</span>' +
        '<select id="viewAsSelect" style="flex:1; min-width:160px; padding:6px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--ink); font-size:14px; cursor:pointer;">' +
          '<option value="">— My own tasks</option>';
    doersList.forEach(d => {
      const sel = viewAsEmail === d.email ? ' selected' : '';
      dropHtml += '<option value="' + escHtml(d.email) + '"' + sel + '>' + escHtml(d.name) + ' (' + escHtml(d.email) + ')</option>';
    });
    dropHtml += '</select></div>';
    app.insertAdjacentHTML('beforeend', dropHtml);
    document.getElementById('viewAsSelect').onchange = (e) => {
      viewAsEmail = e.target.value || null;
      const doer = doersList.find(d => d.email === viewAsEmail);
      document.getElementById('pageTitle').textContent = viewAsEmail
        ? ('Tasks: ' + (doer ? doer.name : viewAsEmail))
        : 'My Tasks Today';
      loadDoerView(true);
    };
  }
  document.getElementById('doerRefreshBtn').onclick = async (e) => {
    e.target.disabled = true;
    e.target.textContent = 'Refreshing…';
    const ok = await loadDoerView(true);
    if (ok) toast(refreshToastMessage(), 'success');
  };

  app.insertAdjacentHTML('beforeend',
    '<div class="filter-row">' +
      statusChip('all', 'All') +
      statusChip('overdue', 'Overdue (' + doerOverdueCache.length + ')') +
      statusChip('rejected', 'Rejected (' + doerRejectedCache.length + ')') +
      statusChip('today', 'Due Today (' + doerTodayCache.length + ')') +
      (doerAwaitingCache.length > 0
        ? statusChip('awaiting', 'Awaiting Approval (' + doerAwaitingCache.length + ')') : '') +
    '</div>'
  );
  app.querySelectorAll('.status-chip').forEach(chip => {
    chip.onclick = () => { doerStatusFilter = chip.dataset.status; renderDoerView(); };
  });

  renderFilterRow(app, allItems, doerFilter, (freq) => { doerFilter = freq; renderDoerView(); });

  // Department filter — only worth showing when the person actually has
  // tasks in more than one department; otherwise it's just noise.
  const doerDepts = [...new Set(allItems.map(t => String(t.department || '').trim()).filter(Boolean))].sort();
  if (doerDepts.length > 1) {
    let dHtml = '<div class="filter-bar"><div class="filter-group">' +
      '<span class="filter-label">Department</span>' +
      '<select class="filter-select' + (doerDeptFilter !== 'All' ? ' on' : '') + '" id="doerDeptSelect">' +
      '<option value="All">All (' + allItems.length + ')</option>';
    doerDepts.forEach(dp => {
      const n = allItems.filter(t => String(t.department || '').trim() === dp).length;
      dHtml += '<option value="' + escHtml(dp) + '"' + (doerDeptFilter === dp ? ' selected' : '') + '>' +
               escHtml(dp) + ' (' + n + ')</option>';
    });
    dHtml += '</select></div></div>';
    app.insertAdjacentHTML('beforeend', dHtml);
    document.getElementById('doerDeptSelect').onchange = (e) => {
      doerDeptFilter = e.target.value; renderDoerView();
    };
  }

  const matchesDoerFilters = (t) =>
    (doerFilter === "All" || t.freq === doerFilter) &&
    (doerDeptFilter === "All" || String(t.department || '').trim() === doerDeptFilter);

  const todayFiltered = doerTodayCache.filter(matchesDoerFilters);
  const rejectedFiltered = doerRejectedCache.filter(matchesDoerFilters);
  const overdueFiltered = doerOverdueCache.filter(matchesDoerFilters);
  const awaitingFiltered = doerAwaitingCache.filter(matchesDoerFilters);

  const showOverdue = doerStatusFilter === 'all' || doerStatusFilter === 'overdue';
  const showRejected = doerStatusFilter === 'all' || doerStatusFilter === 'rejected';
  const showToday = doerStatusFilter === 'all' || doerStatusFilter === 'today';
  const showAwaiting = doerStatusFilter === 'all' || doerStatusFilter === 'awaiting';

  if (showAwaiting && awaitingFiltered.length > 0) {
    app.insertAdjacentHTML('beforeend',
      '<div class="section-title">⏳ Awaiting approval — done, waiting on approval</div>');
    awaitingFiltered.forEach(t => app.appendChild(taskCard(t, 'awaiting')));
  }

  if (showOverdue && overdueFiltered.length > 0) {
    app.insertAdjacentHTML('beforeend', '<div class="section-title warn">⏰ Overdue — missed, please complete</div>');
    renderGroupedByDate(app, overdueFiltered, (t) => taskCard(t, 'overdue'));
  }

  if (showRejected && rejectedFiltered.length > 0) {
    app.insertAdjacentHTML('beforeend', '<div class="section-title warn">⚠ Rejected — redo required</div>');
    rejectedFiltered.forEach(t => app.appendChild(taskCard(t, 'rejected')));
  }

  if (showToday) {
    app.insertAdjacentHTML('beforeend', '<div class="section-title">Today\'s Tasks</div>');
    if (todayFiltered.length === 0) {
      app.insertAdjacentHTML('beforeend', '<div class="empty">✅ Nothing here — you\'re all caught up.</div>');
    }
    todayFiltered.forEach(t => app.appendChild(taskCard(t, 'today')));
  }

  if (doerStatusFilter !== 'all' &&
      ((doerStatusFilter === 'overdue' && overdueFiltered.length === 0) ||
       (doerStatusFilter === 'rejected' && rejectedFiltered.length === 0) ||
       (doerStatusFilter === 'today' && todayFiltered.length === 0) ||
       (doerStatusFilter === 'awaiting' && awaitingFiltered.length === 0))) {
    app.insertAdjacentHTML('beforeend', '<div class="empty">✅ Nothing in this view.</div>');
  }
}

function statusChip(status, label) {
  return '<div class="chip status-chip ' + (doerStatusFilter === status ? 'active' : '') + '" data-status="' + status + '">' + label + '</div>';
}

function taskCard(t, kind) {
  const card = document.createElement('div');
  card.className = (kind === 'today') ? 'card' : 'card rejected';
  const badge = kind === 'rejected' ? '<span class="badge">Rejected</span>'
              : (kind === 'overdue' ? '<span class="badge">Overdue</span>'
              : (kind === 'awaiting' ? '<span class="badge" style="background:var(--ink-light)">Waiting</span>' : ''));
  card.innerHTML =
    '<div class="task-name">' + escHtml(t.task) + (t.freq ? '<span class="freq-tag">' + escHtml(FREQ_LABELS[t.freq] || t.freq) + '</span>' : '') + badge + '</div>' +
    '<div class="meta">' + escHtml(t.department) + '<span class="dot">•</span>Planned ' + escHtml(t.planned) + '</div>';

  if (kind === 'awaiting') {
    // pc@ looking at someone else's screen via View As is exactly where
    // she'd notice a stuck/awaiting task — let her approve or decline right
    // here instead of having to go find the same task in the Review Panel.
    // Never shown on your own tasks (an approver's own submissions
    // auto-approve, so this never applies) or for a non-approver's View As
    // (mis@) — that stays strictly read-only.
    if (isApprover && viewAsEmail) {
      const actions = document.createElement('div');
      actions.className = 'actions';
      const approveBtn = document.createElement('button');
      approveBtn.className = 'btn-approve'; approveBtn.textContent = 'Approve';
      const declineBtn = document.createElement('button');
      declineBtn.className = 'btn-reject'; declineBtn.textContent = 'Decline';
      approveBtn.onclick = () => decideFromDoerView(t.id, true, approveBtn, declineBtn, card);
      declineBtn.onclick = () => decideFromDoerView(t.id, false, declineBtn, approveBtn, card);
      actions.appendChild(approveBtn); actions.appendChild(declineBtn);
      card.appendChild(actions);
    } else {
      // Already submitted — the doer has nothing left to do on it, so
      // there's no button. It clears once pc@ approves (fills column H).
      card.insertAdjacentHTML('beforeend',
        '<div class="meta" style="margin-top:8px; color:var(--ink-light);">Sent for approval — no action needed from you</div>');
    }
    return card;
  }

  // "View As" is a read-only lens for a non-approver (mis@) — she can look
  // but never act on someone else's tasks. pc@, the approver, CAN act here:
  // tapping Done on someone else's task completes it immediately (she'd
  // just approve it right after anyway), letting her close it out directly
  // from their screen instead of waiting for them to submit it themselves.
  const viewingSomeoneElse = isAdmin && viewAsEmail;
  if (viewingSomeoneElse && !isApprover) return card;

  const actions = document.createElement('div');
  actions.className = 'actions';
  const btn = document.createElement('button');
  btn.className = 'btn-done';
  btn.textContent = (kind === 'today') ? 'Done ✓' : 'Mark Done Now';
  btn.onclick = () => markDone(t, kind, btn);
  actions.appendChild(btn);
  card.appendChild(actions);
  return card;
}

// Approve/decline an "awaiting" task straight from a View As screen —
// same backend actions as the Review Panel's decide(), just reached from a
// different screen and updating doerAwaitingCache instead of the admin
// caches.
async function decideFromDoerView(id, approve, btn, otherBtn, card) {
  if (!id) {
    toast('This task list is out of date — refreshing…', 'error');
    loadDoerView(true);
    return;
  }

  let remark = '';
  if (!approve) {
    remark = (prompt('Reason for declining (required):') || '').trim();
    if (!remark) return;
  }

  btn.disabled = true; otherBtn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = approve ? 'Approving…' : 'Declining…';

  try {
    if (approve) await callApi('approve', { id });
    else await callApi('reject', { id, remark });

    toast(approve ? 'Task approved' : 'Task declined — sent back to doer', 'success');
    card.style.transition = 'opacity .2s ease';
    card.style.opacity = '0';
    setTimeout(() => {
      doerAwaitingCache = doerAwaitingCache.filter(t => String(t.id) !== String(id));
      const effectiveEmail = (isAdmin && viewAsEmail) ? viewAsEmail : userEmail;
      localCacheSet('dashboard_v2_' + effectiveEmail, {
        today: doerTodayCache, rejected: doerRejectedCache, overdue: doerOverdueCache, awaiting: doerAwaitingCache
      });
      renderDoerView();
    }, 180);
  } catch (err) {
    toast(err.message, 'error');
    btn.disabled = false; otherBtn.disabled = false;
    btn.textContent = originalText;
  }
}

async function markDone(t, kind, btn) {
  const id = t.id;
  if (!id) {
    // Defensive: a task rendered from a stale/old-format cached snapshot
    // (from before tasks were identified by ID instead of row number) would
    // have no id — sending that to the backend as the literal string
    // "undefined" produced a confusing "Task not found" error. Force a
    // fresh reload instead of letting that reach the server.
    toast('This task list is out of date — refreshing…', 'error');
    loadDoerView(true);
    return;
  }
  const card = btn.closest('.card');
  const effectiveEmail = (isAdmin && viewAsEmail) ? viewAsEmail : userEmail;
  btn.disabled = true;
  btn.textContent = 'Saving…';

  // Apps Script web-app responses sometimes drop mid-flight (the sheet write
  // already happened but the HTTP response never arrives). Retry up to 3
  // times with backoff before treating it as a real failure.
  let result = null;
  let lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    if (attempt > 0) {
      btn.textContent = 'Retrying…';
      await new Promise(r => setTimeout(r, attempt * 1500));
    }
    try {
      result = await callApi('markDone', { id });
      lastErr = null;
      break;
    } catch (e) {
      lastErr = e;
    }
  }

  if (result) {
    // Success path
    if (kind === 'rejected') doerRejectedCache = doerRejectedCache.filter(t => t.id !== id);
    else if (kind === 'overdue') doerOverdueCache = doerOverdueCache.filter(t => t.id !== id);
    else doerTodayCache = doerTodayCache.filter(t => t.id !== id);
    if (!result.autoApproved) {
      doerAwaitingCache = doerAwaitingCache.concat([
        { id: id, task: t.task, department: t.department, freq: t.freq, planned: t.planned, actual: '', status: 'Submitted' }
      ]);
    }
    localCacheSet('dashboard_v2_' + effectiveEmail, { today: doerTodayCache, rejected: doerRejectedCache, overdue: doerOverdueCache, awaiting: doerAwaitingCache });
    card.style.transition = 'opacity .2s ease';
    card.style.opacity = '0';
    setTimeout(() => renderDoerView(), 180);
    toast(result.autoApproved ? 'Task marked as done' : 'Task marked as done — sent for approval', 'success');
  } else {
    // All 3 attempts failed. The sheet write may have landed on attempt 1
    // even though the response didn't reach us. Re-fetch the dashboard; if
    // the task has disappeared it succeeded despite the network error.
    btn.textContent = 'Checking…';
    try {
      const apiParams = {};
      if (isAdmin && viewAsEmail) apiParams.viewAs = viewAsEmail;
      const freshData = await callApi('dashboard', apiParams);
      doerTodayCache    = freshData.today;
      doerRejectedCache = freshData.rejected;
      doerOverdueCache  = freshData.overdue  || [];
      doerAwaitingCache = freshData.awaiting || [];
      localCacheSet('dashboard_v2_' + effectiveEmail, freshData);
      renderDoerView();
      const taskGone = !doerTodayCache.some(x => String(x.id) === String(id)) &&
                       !doerOverdueCache.some(x => String(x.id) === String(id)) &&
                       !doerRejectedCache.some(x => String(x.id) === String(id));
      toast(taskGone ? 'Task submitted successfully' : lastErr.message,
            taskGone ? 'success' : 'error');
    } catch (_) {
      toast(lastErr.message, 'error');
      btn.disabled = false;
      btn.textContent = (kind === 'today') ? 'Done ✓' : 'Mark Done Now';
    }
  }
}

// ADMIN VIEW — grouped by user, with frequency filter + legend

let adminTab = "approvals"; // 'approvals' | 'overdue' | 'rejected' | 'done' | 'performance' | 'tasktracker'
let adminOverdueCache = [];
let adminPerformanceCache = [];
let adminRejectedCache = [];
let adminDoneCache = []; // recently completed — admins can roll these back

let adminViewHasData = false; // true once the panel has shown real (cached or live) data — guards against a failed refresh wiping a working screen

// Task Tracker (the separate Hindi day-checklist app) pending submissions,
// grouped by day: { dayName: [{ rowNumber, timestamp, amount, description,
// tasks, links }] }. Fetched from TASK_TRACKER_API_URL, not this app's own
// backend.
let taskTrackerCache = {};
let taskTrackerPendingCount = 0;
let taskTrackerHasData = false;

// Result of the last "diagnose" call — shows which Master sheet header
// each field resolved to. null until loaded.
let diagnoseCache = null;

async function loadAdminView(force) {
  const cacheKey = 'admin_v2_' + userEmail;
  const cached = force ? null : localCacheGet(cacheKey);
  if (cached) {
    adminPendingCache = cached.pending;
    adminOverdueCache = cached.overdue;
    adminPerformanceCache = cached.performance || [];
    adminRejectedCache = cached.rejected || [];
    adminDoneCache = cached.done || [];
    adminFilter = "All"; adminDeptFilter = "All"; adminUserFilter = "All";
    renderAdminView(); // instant paint from last-known data
    adminViewHasData = true;
  }
  try {
    // One combined request instead of 4 separate ones (pendingApprovals /
    // overdueSummary / rejectedSummary / performance) — those were each a
    // full sheet scan as their own network round-trip, which was 4x the
    // latency and 4x the Apps Script execution-time quota usage for what
    // is fundamentally one pass over one sheet.
    const data = await callApi('adminSummary', force ? { force: 1 } : {});
    adminPendingCache = data.pending;
    adminOverdueCache = data.overdue;
    adminPerformanceCache = data.performance || [];
    adminRejectedCache = data.rejected || [];
    adminDoneCache = data.done || [];
    if (data.doers) doersList = data.doers;
    lastBuiltAt = data.builtAt || null;
    lastRefreshQueued = !!data.refreshing;
    localCacheSet(cacheKey, { pending: adminPendingCache, overdue: adminOverdueCache, performance: adminPerformanceCache, rejected: adminRejectedCache, done: adminDoneCache });
  adminFilter = "All"; adminDeptFilter = "All"; adminUserFilter = "All";
    renderAdminView(); // refresh with live data
    adminViewHasData = true;
    return true;
  } catch (err) {
    // Only replace the screen with an error box if there's nothing already
    // showing — otherwise a failed Refresh would wipe out a perfectly good
    // view that was already on screen, instead of just reporting the error.
    if (!adminViewHasData) {
      document.getElementById('app').innerHTML = '<div class="error-box">' + err.message + '</div>';
    }
    toast(err.message, 'error');
    return false;
  }
}

function initials(name) {
  if (!name) return "?";
  const parts = String(name).replace(/^(Mr\.|Ms\.|Mrs\.)\s*/i, '').trim().split(/\s+/);
  return (parts[0]?.[0] || '') + (parts[1]?.[0] || '');
}

function renderAdminView() {
  const app = document.getElementById('app');
  app.innerHTML = "";

  app.insertAdjacentHTML('beforeend',
    '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px; flex-wrap:wrap;">' +
      '<button class="legend-btn" id="myTasksBtn">My Tasks →</button>' +
      '<div style="display:flex; gap:14px;">' +
        (isApprover ? '<button class="legend-btn" id="diagnoseBtn">🔍 Diagnose</button>' : '') +
        '<button class="legend-btn" id="adminRefreshBtn">⟳ Refresh</button>' +
      '</div>' +
    '</div>'
  );
  document.getElementById('myTasksBtn').onclick = () => {
    adminShowMyTasks = true;
    viewAsEmail = null;
    document.getElementById('pageTitle').textContent = 'My Tasks Today';
    loadDoerView();
  };
  document.getElementById('adminRefreshBtn').onclick = async (e) => {
    e.target.disabled = true;
    e.target.textContent = 'Refreshing…';
    const ok = await loadAdminView(true);
    if (ok) toast(refreshToastMessage(), 'success');
  };
  if (isApprover) {
    document.getElementById('diagnoseBtn').onclick = () => loadDiagnose();
  }

  // Performance tracking is MIS's job — pc@ never even sees the tab, so a
  // stale adminTab='performance' (e.g. from an old cached session) must not
  // leave her stuck on a view she has no way to navigate off of.
  if (!canSeePerformance && adminTab === 'performance') adminTab = 'approvals';
  if (!isApprover && adminTab === 'tasktracker') adminTab = 'approvals';
  if (!isApprover && adminTab === 'diagnose') adminTab = 'approvals';

  if (adminTab === 'diagnose' && isApprover) {
    renderDiagnoseView(app);
    return;
  }

  app.insertAdjacentHTML('beforeend',
    '<div class="stat-row">' +
      '<div class="stat-box ' + (adminTab === 'approvals' ? 'ok' : 'warn') + '" id="tabApprovals" style="cursor:pointer">' +
        '<div class="stat-num">' + adminPendingCache.length + '</div><div class="stat-label">To Review</div></div>' +
      '<div class="stat-box warn" id="tabOverdue" style="cursor:pointer">' +
        '<div class="stat-num">' + adminOverdueCache.length + '</div><div class="stat-label">Overdue (not done)</div></div>' +
      '<div class="stat-box warn" id="tabRejected" style="cursor:pointer">' +
        '<div class="stat-num">' + adminRejectedCache.length + '</div><div class="stat-label">Rejected</div></div>' +
      '<div class="stat-box ok" id="tabDone" style="cursor:pointer">' +
        '<div class="stat-num">' + adminDoneCache.length + '</div><div class="stat-label">Done (undo)</div></div>' +
      (canSeePerformance
        ? '<div class="stat-box ok" id="tabPerformance" style="cursor:pointer">' +
            '<div class="stat-num">' + adminPerformanceCache.length + '</div><div class="stat-label">Performance</div></div>'
        : '') +
      (isApprover
        ? '<div class="stat-box warn" id="tabTaskTracker" style="cursor:pointer">' +
            '<div class="stat-num">' + taskTrackerPendingCount + '</div><div class="stat-label">Task Tracker</div></div>'
        : '') +
    '</div>'
  );
  const resetAdminFilters = () => { adminFilter = 'All'; adminDeptFilter = 'All'; adminUserFilter = 'All'; };
  document.getElementById('tabApprovals').onclick = () => { adminTab = 'approvals'; resetAdminFilters(); renderAdminView(); };
  document.getElementById('tabOverdue').onclick = () => { adminTab = 'overdue'; resetAdminFilters(); renderAdminView(); };
  document.getElementById('tabRejected').onclick = () => { adminTab = 'rejected'; resetAdminFilters(); renderAdminView(); };
  document.getElementById('tabDone').onclick = () => { adminTab = 'done'; resetAdminFilters(); renderAdminView(); };
  if (canSeePerformance) {
    document.getElementById('tabPerformance').onclick = () => { adminTab = 'performance'; renderAdminView(); };
  }
  if (isApprover) {
    document.getElementById('tabTaskTracker').onclick = () => loadTaskTrackerApprovals();
  }

    renderPerformanceView(app);
    return;
  }

    renderTaskTrackerView(app);
    return;
  }

  const sourceByTab = {
    approvals: adminPendingCache,
    overdue:   adminOverdueCache,
    rejected:  adminRejectedCache,
    done:      adminDoneCache
  };
  const source = sourceByTab[adminTab] || adminPendingCache;
  renderAdminFilters(app, source);

  const filtered = applyAdminFilters(source);

  const sectionTitles = {
    approvals: 'To Review',
    overdue: '⏰ Overdue — not yet done by anyone',
    rejected: '⚠ Rejected — sent back for redo',
    done: '✅ Recently done — undo if marked by mistake'
  };

  // Daily tasks marked done before the auto-approve backend fix went live
  // are stuck sitting as "Submitted" — this clears that backlog in one go
  // instead of approving them one by one.
  const stuckDaily = (adminTab === 'approvals' && isApprover) ? adminPendingCache.filter(t => t.freq === 'D') : [];
  if (stuckDaily.length > 0) {
    app.insertAdjacentHTML('beforeend',
      '<div class="empty" style="background:var(--amber-bg); border-radius:10px; padding:10px 14px; margin-bottom:10px;">' +
        '⚠ <span>' + stuckDaily.length + ' Daily task' + (stuckDaily.length > 1 ? 's' : '') + ' stuck in review from before the auto-approve fix. </span>' +
        '<button class="legend-btn" id="autoApproveDailyBtn" style="margin-left:6px;">Approve all Daily now</button>' +
      '</div>'
    );
    document.getElementById('autoApproveDailyBtn').onclick = async (e) => {
      e.target.disabled = true;
      e.target.textContent = 'Approving…';
      // One request approving all of them, instead of one request per task
      // (which meant N network round-trips — each with its own overhead —
      // for N tasks; this was the main reason the bulk button felt slow
      // and prone to timing out partway through).
      try {
        const result = await callApi('bulkApprove', { ids: stuckDaily.map(t => t.id).join(',') });
        const succeededIds = result.approved || [];
        const failCount = (result.failed || []).length;
        adminPendingCache = adminPendingCache.filter(t => !succeededIds.includes(t.id));
        localCacheSet('admin_v2_' + userEmail, { pending: adminPendingCache, overdue: adminOverdueCache, performance: adminPerformanceCache, rejected: adminRejectedCache });
        toast(
          failCount > 0
            ? 'Approved ' + succeededIds.length + ', ' + failCount + ' failed — tap the button again to retry those'
            : 'Approved ' + succeededIds.length + ' Daily task(s)',
          failCount > 0 ? 'error' : 'success'
        );
      } catch (err) {
        toast(err.message, 'error');
      }
      renderAdminView();
    };
  }
  app.insertAdjacentHTML('beforeend', '<div class="section-title">' + sectionTitles[adminTab] + '</div>');
  if (filtered.length === 0) {
    const filtersOn = adminFilter !== 'All' || adminDeptFilter !== 'All' || adminUserFilter !== 'All';
    app.insertAdjacentHTML('beforeend',
      '<div class="empty">' + (filtersOn
        ? '🔍 Nothing matches these filters — try clearing them.'
        : '✅ All clear, nothing here.') + '</div>');
    return;
  }

  // "kiske kitne pending hai" at a glance, for whatever is currently filtered
  const peopleCount = new Set(filtered.map(t => t.email)).size;
  app.insertAdjacentHTML('beforeend',
    '<div class="summary-line">Showing <b>' + filtered.length + '</b> task' + (filtered.length === 1 ? '' : 's') +
    ' across <b>' + peopleCount + '</b> ' + (peopleCount === 1 ? 'person' : 'people') + '</div>');

  // One tile per user — collapsed by default, tap a user to reveal their tasks
  const groups = new Map();
  filtered.forEach(t => {
    const key = t.email;
    if (!groups.has(key)) groups.set(key, { name: t.name, email: t.email, tasks: [] });
    groups.get(key).tasks.push(t);
  });

  [...groups.values()]
    .sort((a, b) => b.tasks.length - a.tasks.length)
    .forEach(g => app.appendChild(userGroupTile(g, adminTab)));
}
